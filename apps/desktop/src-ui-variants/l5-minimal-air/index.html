<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCP · 浅色 5 极简留白</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --line:#ecedf1;
    --line-2:#f3f4f7;
    --fg:#101418;
    --fg-2:#3a424d;
    --muted:#626b78;
    --muted-2:#98a0ac;
    --accent:#165dff;
    --accent-soft:#edf3ff;
    --ok:#0f9d58;
    --ok-soft:#eaf7ef;
    --warn:#9a5b00;
    --warn-soft:#fdf5e7;
    --err:#c62828;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei UI",sans-serif;
    display:flex;justify-content:center;padding:0 28px;
    user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
  }

  .frame{
    width:100%;max-width:1180px;height:100%;min-height:0;
    display:flex;flex-direction:column;
  }

  /* ---------- 顶栏：只用一条细线分隔 ---------- */
  .bar{flex:0 0 auto;height:76px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  [data-mark]{width:30px;height:30px;display:block;flex:0 0 auto;border-radius:8px}
  .mark-bg{fill:#101418}
  .mark-f{fill:#fff}
  .mark-dot{fill:#165dff}
  .brand b{font-size:15px;letter-spacing:.01em;font-weight:650}
  .brand small{font-size:12px;color:var(--muted);margin-left:2px}
  .bar .spacer{flex:1}

  .state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%;background:#c9ced6;transition:.25s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px #0f9d581f}
  .dot.bad{background:var(--err);box-shadow:0 0 0 3px #c628281f}
  .state b{font:12.5px var(--mono);color:var(--fg-2);font-weight:600;min-width:42px;text-align:right}

  /* ---------- 三段式：表单 / 分隔线 / 数字 ---------- */
  main{
    flex:1;min-height:0;display:grid;gap:0;
    grid-template-columns:minmax(0,1fr) 1px minmax(320px,.68fr);
    grid-template-rows:auto;
  }
  .col-form{padding:28px 40px 24px 0;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
  .divider{background:var(--line)}
  .col-read{padding:28px 0 24px 40px;display:flex;flex-direction:column;gap:26px;min-height:0;overflow:auto}

  .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin:0 0 18px}

  /* ---------- 表单：无边框，底部一条线 ---------- */
  .form{display:flex;flex-direction:column;gap:18px;max-width:520px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field .lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.01em}
  .field .lbl em{font-style:normal;color:var(--muted-2);margin-left:6px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:26px}

  .input-wrap{position:relative;display:flex;align-items:center}
  input{
    width:100%;height:36px;background:transparent;color:var(--fg);
    border:0;border-bottom:1px solid #d9dde4;border-radius:0;padding:0 0 4px;
    font:inherit;font-size:15.5px;font-weight:450;outline:none;transition:border-color .15s;
    user-select:text;-webkit-user-select:text;
  }
  input:hover:not(:disabled){border-bottom-color:#b9c0cb}
  input:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 0 var(--accent)}
  input:disabled{color:var(--fg-2);border-bottom-style:dashed;cursor:default}
  input::placeholder{color:#aab1bc;font-weight:400}
  .input-wrap input.has-trail{padding-right:86px}
  .trail{position:absolute;right:0;top:0;bottom:4px;display:flex;align-items:center;gap:2px}
  .key-state{font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;padding:0 4px}
  .key-state.ok{color:var(--ok)}
  .key-state.bad{color:var(--err)}

  button{
    font:inherit;cursor:pointer;transition:.15s;border-radius:9px;border:1px solid transparent;
    background:transparent;color:var(--fg-2);height:36px;padding:0 14px;font-size:13px;font-weight:500;
  }
  button:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
  button:disabled{opacity:.45;cursor:default}
  button.icon{width:28px;height:28px;padding:0;display:grid;place-items:center;color:var(--muted);font-size:14px;border-radius:7px}
  #start{
    height:44px;padding:0 26px;border-radius:10px;font-size:14px;font-weight:600;
    background:var(--fg);color:#fff;box-shadow:0 1px 2px #1014181f;
  }
  #start:hover:not(:disabled){background:#000;color:#fff}
  #stop{height:44px;padding:0 20px;color:var(--muted)}
  body.is-running #start{display:none}
  body.is-running #stop{
    height:44px;padding:0 26px;border-radius:10px;font-size:14px;font-weight:600;
    background:var(--surface-2);color:var(--err);border-color:#f0d3d3;
  }
  body.is-running #stop:hover{background:#fdf1f1;border-color:#e8bcbc;color:var(--err)}

  .check{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:-4px}
  .check input{width:14px;height:14px;padding:0;height:14px;accent-color:var(--accent)}

  .adv-toggle{
    height:auto;width:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
    padding:6px 0;border-radius:0;color:var(--muted);font-size:12.5px;
  }
  .adv-toggle:hover:not(:disabled){background:transparent;color:var(--accent)}
  .adv-toggle .chev{font-size:9px;transition:transform .2s;color:var(--muted-2)}
  .adv-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .adv-toggle .defaults{margin-left:6px;font-size:11.5px;color:var(--muted-2);font-weight:400;font-variant-numeric:tabular-nums}
  .adv-body{
    display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;padding:18px 18px 10px;
    background:var(--surface-2);border-radius:12px;margin-top:-8px;
  }
  .adv-body[hidden]{display:none}
  .adv-body input{height:32px;font-size:14px;border-bottom-color:#d2d7df}
  .adv-note{grid-column:1/-1;margin:0;font-size:11.5px;color:var(--muted-2)}

  .actions{display:flex;align-items:center;gap:10px;margin-top:8px}
  .actions #hint{font-size:12px;color:var(--muted);margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions #hint.error{color:var(--err)}

  /* ---------- 右侧：数字 ---------- */
  .headline{display:flex;align-items:flex-end;gap:10px}
  .headline b{font-size:56px;line-height:.95;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--fg)}
  .headline span{font-size:12.5px;color:var(--muted);padding-bottom:8px}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .row .cap{font-size:12.5px;color:var(--muted)}
  .row b{font-size:15px;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  #diag{display:flex;flex-wrap:wrap;gap:6px}
  #diag[hidden]{display:none}
  #diag .metric{
    display:flex;gap:6px;align-items:baseline;padding:3px 9px;border-radius:6px;
    background:var(--warn-soft);color:var(--warn);font-size:11.5px;
  }
  #diag .metric .cap{color:var(--warn)}
  #diag .metric b{font-weight:600}

  /* ---------- 日志：通栏细线区 ---------- */
  .log{
    flex:0 0 auto;display:flex;flex-direction:column;min-height:130px;height:28vh;max-height:230px;
    border-top:1px solid var(--line);
  }
  .log-head{display:flex;align-items:center;gap:10px;height:42px;font-size:12px;color:var(--muted)}
  .log-head b{font-weight:600;color:var(--fg-2);font-size:12.5px}
  .log-head button{margin-left:auto;height:26px;padding:0 10px;font-size:11.5px;color:var(--muted)}
  #log{
    flex:1;min-height:0;margin:0 0 22px;overflow:auto;padding:12px 14px;border-radius:10px;background:#fafbfc;
    font:11.8px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;color:#4a5462;
    user-select:text;-webkit-user-select:text;
  }
  #log::-webkit-scrollbar{width:9px}
  #log::-webkit-scrollbar-thumb{background:#e0e3e9;border-radius:9px}
  #log .err{color:var(--warn)}
  #log .out{color:#68717f}

  @media (max-width:980px){
    main{grid-template-columns:1fr;grid-template-rows:auto auto}
    .divider{display:none}
    .col-form{padding:24px 0 8px}
    .col-read{padding:20px 0 24px;border-top:1px solid var(--line)}
    body{overflow:auto}
  }
</style>
</head>
<body>
<div class="frame">
  <header class="bar">
    <div class="brand">
      <span data-mark></span>
      <b>FCP</b><small>可靠传输客户端</small>
    </div>
    <div class="spacer"></div>
    <div class="state">
      <span class="dot" id="dot"></span>
      <span id="state-text">未连接</span>
      <b id="uptime">--</b>
    </div>
  </header>

  <main>
    <section class="col-form">
      <p class="eyebrow">连接</p>

      <div class="form">
        <div class="field">
          <span class="lbl">服务器地址</span>
          <div class="input-wrap"><input id="host" placeholder="1.2.3.4 或 vpn.example.com" autocomplete="off" spellcheck="false" /></div>
        </div>

        <div class="duo">
          <div class="field">
            <span class="lbl">UDP 端口</span>
            <input id="port" type="number" min="1" max="65535" value="4460" />
          </div>
          <div class="field">
            <span class="lbl">本地代理端口 <em>SOCKS5 / HTTP</em></span>
            <input id="listenPort" type="number" min="1" max="65535" value="1080" />
          </div>
        </div>

        <div class="field">
          <span class="lbl">预共享密钥 <em>32 位十六进制</em></span>
          <div class="input-wrap">
            <input id="key" class="has-trail" type="password" maxlength="32" spellcheck="false" placeholder="与服务端一致" autocomplete="off" />
            <span class="trail">
              <span class="key-state" id="keyState"></span>
              <button class="icon" id="keyToggle" type="button" title="显示 / 隐藏">👁</button>
            </span>
          </div>
        </div>

        <label class="check"><input id="remember" type="checkbox" checked /> 记住设置</label>

        <button class="adv-toggle" id="advToggle" type="button" aria-expanded="false" aria-controls="advBody">
          <span class="chev">▶</span><span data-label>高级设置</span>
          <span class="defaults">MTU 1400 · FEC 0.5 · k 自适应 · 127.0.0.1</span>
        </button>
        <div class="adv-body" id="advBody" hidden>
          <div class="field"><span class="lbl">本地监听地址</span><input id="listen" value="127.0.0.1" /></div>
          <div class="field"><span class="lbl">MTU</span><input id="mtu" type="number" min="576" max="9000" value="1400" /></div>
          <div class="field"><span class="lbl">FEC 冗余上限 <em>0–1</em></span><input id="budget" type="number" step="0.05" min="0" max="1" value="0.5" /></div>
          <div class="field"><span class="lbl">固定 k <em>-1 为自适应</em></span><input id="k" type="number" min="-1" max="7" value="-1" /></div>
          <p class="adv-note">不展开时按默认值提交，与显式填写效果相同。</p>
        </div>

        <div class="actions">
          <button id="start" type="button">启动代理</button>
          <button id="stop" type="button" disabled>停止</button>
          <span id="hint"></span>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="col-read">
      <div>
        <p class="eyebrow">运行状态</p>
        <div class="headline"><b id="m-live">0</b><span>活动会话 · 采样 <span id="m-t">--</span></span></div>
      </div>

      <div class="rows">
        <div class="row"><span class="cap">上行 OUT</span><b id="m-tx">0 B</b></div>
        <div class="row"><span class="cap">下行 IN</span><b id="m-rx">0 B</b></div>
        <div class="row"><span class="cap">已建立会话</span><b id="m-est">0</b></div>
        <div class="row"><span class="cap">累计隧道</span><b id="m-tun">0</b></div>
      </div>

      <div id="diag" hidden></div>
    </section>
  </main>

  <section class="log">
    <div class="log-head"><b>日志</b><span>stdout / stderr</span><button id="clear" type="button">清空</button></div>
    <pre id="log"></pre>
  </section>
</div>

<script src="tokens.js"></script>
<script src="app-light.js"></script>
<script>
  document.addEventListener("fcp:state", (e) => {
    const t = document.getElementById("state-text");
    if (t) t.textContent = e.detail.running ? "已连接" : "未连接";
  });
</script>
</body>
</html>
