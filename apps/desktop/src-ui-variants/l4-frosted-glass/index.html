<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCP · 浅色 4 磨砂玻璃</title>
<style>
  :root{
    --bg:#eef2fb;
    --glass:rgba(255,255,255,.72);
    --glass-2:rgba(255,255,255,.55);
    --line:rgba(255,255,255,.85);
    --line-soft:rgba(210,220,240,.55);
    --fg:#1a2233;
    --fg-2:#3f4a60;
    --muted:#5b6475;
    --muted-2:#8b95ab;
    --accent:#2f6fed;
    --accent-2:#6d5efc;
    --accent-soft:rgba(77,120,240,.14);
    --ok:#0ea472;
    --ok-soft:rgba(14,164,114,.14);
    --warn:#b45309;
    --warn-soft:rgba(240,180,90,.20);
    --err:#d92d20;
    --r:22px;
    --shadow:0 1px 2px rgba(60,80,140,.06), 0 20px 44px -20px rgba(80,100,160,.30);
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(680px 480px at 8% -8%, rgba(109,94,252,.28) 0%, transparent 60%),
      radial-gradient(640px 460px at 100% 0%, rgba(47,111,237,.24) 0%, transparent 58%),
      radial-gradient(720px 520px at 92% 108%, rgba(120,200,255,.22) 0%, transparent 60%),
      var(--bg);
    color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei UI",sans-serif;
    display:flex;flex-direction:column;padding:0 26px 24px;
    user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
  }
  /* 背景柔光斑，强化磨砂玻璃的可读层次 */
  body::before{
    content:"";position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;
    width:340px;height:340px;left:6%;top:16%;background:rgba(109,94,252,.20);
  }
  body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;
    width:300px;height:300px;right:8%;bottom:10%;background:rgba(47,111,237,.18);
  }

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:12px;height:72px;flex:0 0 auto;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:12px}
  [data-mark]{width:38px;height:38px;display:block;flex:0 0 auto}
  .mark-bg{fill:#fff}
  .mark-f{fill:url(#g-mark)}
  .mark-dot{fill:#8fb0ff}
  .brand b{font-size:16px;letter-spacing:.02em}
  .brand small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .bar .spacer{flex:1}
  .pill{
    display:flex;align-items:center;gap:9px;height:38px;padding:0 18px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:var(--shadow);
    font-size:12.5px;color:var(--muted);
  }
  .pill time{font:13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;min-width:44px;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;background:#c3ccdd;transition:.25s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
  .dot.bad{background:var(--err);box-shadow:0 0 0 4px rgba(217,45,32,.15)}

  /* ---------- 布局 ---------- */
  main{
    flex:1;min-height:0;display:grid;gap:18px;position:relative;z-index:1;
    grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);
    grid-template-rows:auto minmax(150px,1fr);
    grid-template-areas:"conn status" "log log";
    max-width:1320px;width:100%;margin:0 auto;
  }
  .conn{grid-area:conn} .side{grid-area:status} .card.log{grid-area:log}

  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:var(--shadow);padding:24px 28px;min-height:0;display:flex;flex-direction:column;
    position:relative;
  }
  h2{
    margin:0 0 16px;font-size:15px;font-weight:650;color:var(--fg);
    display:flex;align-items:center;gap:10px;
  }
  h2 small{font-size:12.5px;font-weight:400;color:var(--muted)}
  .card.log h2{margin-bottom:12px}

  /* 表单正文竖向均分，卡片再高也不会底部留一块死白 */
  .conn .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .conn .body .actions{margin-top:auto}

  /* ---------- 表单 ---------- */
  .field-list{display:flex;flex-direction:column;gap:13px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field > .lbl{font-size:12.5px;font-weight:550;color:var(--fg-2);display:flex;align-items:center;gap:8px}
  .field > .lbl em{font-style:normal;font-weight:400;color:var(--muted);font-size:11.5px}
  .field.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field.dual > div{display:flex;flex-direction:column;gap:7px}

  .input-wrap{position:relative;display:flex;align-items:center}
  input{
    width:100%;height:46px;background:var(--glass-2);color:var(--fg);
    border:1px solid var(--line-soft);border-radius:12px;padding:0 14px;
    font:inherit;font-size:14px;font-weight:450;outline:none;transition:.16s;
    user-select:text;-webkit-user-select:text;
  }
  input:hover:not(:disabled){border-color:rgba(150,170,220,.7);background:rgba(255,255,255,.78)}
  input:focus{background:rgba(255,255,255,.95);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  input:disabled{opacity:1;background:rgba(244,246,251,.5);color:var(--muted);cursor:default}
  input::placeholder{color:var(--muted-2);font-weight:400}
  .input-wrap input.has-trail{padding-right:92px}
  .trail{position:absolute;right:6px;display:flex;align-items:center;gap:4px}
  .key-state{font-size:11.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;padding:0 4px}
  .key-state.ok{color:var(--ok)}
  .key-state.bad{color:var(--err)}

  button{
    font:inherit;cursor:pointer;border-radius:11px;transition:.16s;border:1px solid var(--line-soft);
    background:var(--glass-2);color:var(--fg-2);padding:0 16px;height:42px;font-size:13.5px;font-weight:550;
  }
  button:hover:not(:disabled){background:rgba(255,255,255,.9);border-color:rgba(150,170,220,.7);color:var(--fg)}
  button:disabled{opacity:.5;cursor:default}
  button.primary{
    height:48px;padding:0 28px;font-size:14.5px;font-weight:600;color:#fff;border-color:transparent;
    background:linear-gradient(180deg,#3f79f4,#5a63ec);
    box-shadow:0 12px 26px -12px rgba(70,99,236,.65), inset 0 1px 0 rgba(255,255,255,.28);
  }
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#4f83f6,#665cf0);color:#fff}
  button.ghost{height:32px;padding:0 11px;font-size:12px;color:var(--fg-2);background:var(--glass-2)}
  button.icon{padding:0;width:34px;height:34px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
  button.right{margin-left:auto;height:32px;padding:0 12px;font-size:12px}

  .actions{display:flex;align-items:center;gap:12px;margin-top:18px}
  .actions .status-line{font-size:12.5px;color:var(--muted);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions .status-line.error{color:var(--err)}

  /* 「高级」折叠区 */
  .adv-toggle{
    display:flex;align-items:center;gap:8px;margin-top:16px;padding:12px 0 0;border-top:1px solid var(--line-soft);
    color:var(--muted);font-size:12.5px;background:transparent;border-left:0;border-right:0;border-bottom:0;
    height:auto;border-radius:0;width:100%;justify-content:flex-start;font-weight:500;
  }
  .adv-toggle:hover:not(:disabled){color:var(--accent);background:transparent;border-color:var(--line-soft)}
  .adv-toggle .chev{transition:transform .2s;font-size:10px;color:var(--muted-2)}
  .adv-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .adv-toggle .defaults{margin-left:auto;font-size:11.5px;color:var(--muted-2);font-weight:400}
  .adv-body{
    margin-top:14px;padding:16px 16px 4px;border-radius:14px;background:rgba(244,247,252,.6);
    border:1px dashed rgba(180,195,225,.7);display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;
  }
  .adv-body[hidden]{display:none}
  .adv-body .field > .lbl{font-size:12px}
  .adv-body input{height:38px;font-size:13px;background:rgba(255,255,255,.85)}
  .adv-body .full{grid-column:1/-1}
  .adv-note{grid-column:1/-1;font-size:11.5px;color:var(--muted-2);margin:0 0 4px}

  .check{display:flex;align-items:center;gap:9px;margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:400}
  .check input{width:16px;height:16px;padding:0;accent-color:var(--accent)}

  /* ---------- 状态卡 ---------- */
  .status-card{padding:22px 24px}
  .status-card .panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
  .big{display:flex;align-items:baseline;gap:10px;margin:-4px 0 16px}
  .big b{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .big span{font-size:13px;color:var(--muted)}
  .mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
  .flow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .flow .f{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;
    background:rgba(244,247,252,.75);border:1px solid var(--line-soft)}
  .flow .f .cap{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .flow .f .cap i{font-style:normal;color:var(--accent);font-size:11px}
  .flow .f .cap i.down{color:#4a7fd0}
  .flow .f b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--fg)}
  .mini{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-soft)}
  .mini .cap{font-size:12px;color:var(--muted)}
  .mini b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
  #diag{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  #diag[hidden]{display:none}
  #diag .metric{
    display:flex;gap:7px;align-items:baseline;padding:4px 10px;border-radius:8px;
    background:var(--warn-soft);color:var(--warn);font-size:11.5px;border:1px solid rgba(240,180,90,.5);
  }
  #diag .metric .cap{color:#b8762a}
  #diag .metric b{font-weight:600}

  /* ---------- 日志 ---------- */
  /* 日志卡整行铺开：常见行（~436px）不折行，只允许在空格处断 */
  .card.log{min-height:0;padding:20px 22px 22px}
  .card.log h2{margin-bottom:10px}
  body.is-running #start{display:none}
  body.is-running #stop{
    height:48px;padding:0 28px;font-size:14.5px;font-weight:600;color:#fff;border-color:transparent;
    background:linear-gradient(180deg,#3c4657,#2a3140);
    box-shadow:0 12px 26px -14px rgba(26,34,51,.55);
  }
  body.is-running #stop:hover{background:linear-gradient(180deg,#455063,#323a49);color:#fff}
  .log pre{
    flex:1 1 auto;min-height:70px;margin:0;overflow:auto;background:rgba(244,247,252,.6);
    border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;
    font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;color:#5b677d;
    user-select:text;-webkit-user-select:text;
  }
  .log pre::-webkit-scrollbar{width:10px}
  .log pre::-webkit-scrollbar-thumb{background:#d5dded;border-radius:10px;border:2px solid rgba(244,247,252,.6)}
  .log .err{color:var(--warn)}
  .log .out{color:#7a8598}

  /* 矮屏（Tauri 最小窗口）与窄屏退回单列，整页滚动，不压叠、不裁切。
     断点按「最小窗口 980 宽」定，留出滚动条 15px 的余量。 */
  @media (max-width:1000px), (max-height:700px){
    main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"conn" "status" "log"}
    .card,.card.log{min-height:auto}
    .conn .body,.status-card .panel{justify-content:flex-start}
    .card.log{height:min(260px,45vh);min-height:150px}
    body::before,body::after{display:none}
  }
</style>
</head>
<body>

<!-- 品牌图标渐变（供 .mark-f fill:url(#g-mark) 引用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#6d5efc"/>
    </linearGradient>
  </defs>
</svg>

<header class="bar">
  <div class="brand">
    <span data-mark></span>
    <div><b>FCP</b><small>可靠传输客户端</small></div>
  </div>
  <div class="spacer"></div>
  <div class="pill">
    <span class="dot" id="dot"></span>
    <span id="state-text">未连接</span>
    <time id="uptime">--</time>
  </div>
</header>

<main>
  <section class="card conn">
    <h2>连接</h2>

    <div class="body">
    <div class="field-list">
      <div class="field">
        <span class="lbl">服务器地址</span>
        <div class="input-wrap"><input id="host" placeholder="1.2.3.4 或 vpn.example.com" autocomplete="off" spellcheck="false" /></div>
      </div>

      <div class="field dual">
        <div>
          <span class="lbl">UDP 端口</span>
          <div class="input-wrap"><input id="port" type="number" min="1" max="65535" value="4460" /></div>
        </div>
        <div>
          <span class="lbl">本地代理端口 <em>SOCKS5 / HTTP</em></span>
          <div class="input-wrap"><input id="listenPort" type="number" min="1" max="65535" value="1080" /></div>
        </div>
      </div>

      <div class="field">
        <span class="lbl">预共享密钥 <em>32 位十六进制</em></span>
        <div class="input-wrap">
          <input id="key" class="has-trail" type="password" maxlength="32" spellcheck="false" placeholder="与服务端一致" autocomplete="off" />
          <span class="trail">
            <span class="key-state" id="keyState"></span>
            <button class="icon" id="keyToggle" type="button" title="显示 / 隐藏">👁</button>
          </span>
        </div>
      </div>
    </div>

    <label class="check"><input id="remember" type="checkbox" checked /> 记住设置</label>

    <button class="adv-toggle" id="advToggle" type="button" aria-expanded="false" aria-controls="advBody">
      <span class="chev">▶</span><span data-label>高级设置</span>
      <span class="defaults">MTU 1400 · FEC 0.5 · k 自适应 · 127.0.0.1</span>
    </button>
    <div class="adv-body" id="advBody" hidden>
      <div class="field"><span class="lbl">本地监听地址</span><input id="listen" value="127.0.0.1" /></div>
      <div class="field"><span class="lbl">MTU</span><input id="mtu" type="number" min="576" max="9000" value="1400" /></div>
      <div class="field"><span class="lbl">FEC 冗余上限 <em>0–1</em></span><input id="budget" type="number" step="0.05" min="0" max="1" value="0.5" /></div>
      <div class="field"><span class="lbl">固定 k <em>-1 = 自适应</em></span><input id="k" type="number" min="-1" max="7" value="-1" /></div>
      <p class="adv-note">不展开时使用上面的默认值，效果与显式填写相同。</p>
    </div>

    <div class="actions">
      <button id="start" class="primary" type="button">启动代理</button>
      <button id="stop" type="button" disabled>停止</button>
      <span id="hint" class="status-line"></span>
    </div>
    </div>
  </section>

  <section class="card status-card side">
    <h2>运行状态</h2>
    <div class="panel">
    <div class="big"><b id="m-live">0</b><span>个活动会话</span></div>

    <div class="flow">
      <div class="f"><span class="cap"><i>↑</i>上行 OUT</span><b id="m-tx">0 B</b></div>
      <div class="f"><span class="cap"><i class="down">↓</i>下行 IN</span><b id="m-rx">0 B</b></div>
    </div>

    <div class="mini-grid">
      <div class="mini"><span class="cap">已建立</span><b id="m-est">0</b></div>
      <div class="mini"><span class="cap">隧道</span><b id="m-tun">0</b></div>
      <div class="mini"><span class="cap">采样</span><b id="m-t">--</b></div>
      <div class="mini"><span class="cap">传输</span><b>UDP / FEC</b></div>
    </div>
    <div id="diag" hidden></div>
    </div>
  </section>

  <section class="card log">
    <h2>日志 <button class="ghost right" id="clear" type="button">清空</button></h2>
    <pre id="log"></pre>
  </section>
</main>

<script src="tokens.js"></script>
<script src="app-light.js"></script>
<script>
  document.addEventListener("fcp:state", (e) => {
    const t = document.getElementById("state-text");
    if (t) t.textContent = e.detail.running ? "已连接" : "未连接";
  });
</script>
</body>
</html>
