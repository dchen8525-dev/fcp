name: release

# 打 tag 即发布：`git tag v0.0.1 && git push origin v0.0.1`
#
# 产出三件发布物，挂在同一条 GitHub Release 上：
#   * fcp-server-<版本>-linux-<arch>.deb  Ubuntu 服务端（同包带 CLI client、systemd unit、conffile）
#   * fcp-client-gui-<版本>-windows-amd64.exe Windows 客户端（单文件，双击运行，免安装）
#   * fcp-client-gui-<版本>-linux-amd64.AppImage  Linux 客户端（双击运行，免安装）
#
# 客户端是 Qt 6 Widgets 壳 + fcp-client sidecar（apps/desktop）。隧道仍由 CLI
# 承载，所以两个客户端 job 先构建 FCP_BUILD_PROXY=ON 的 CLI。
#
# 门禁顺序是"测试在前、打包在后"：linux-deb 跑完整 ctest（Linux Release），
# 测试红了就没有任何产物。客户端 job 另做冒烟：sidecar `--version` 与
# AppImage 离屏启动 6 秒。
#
# 手工触发（workflow_dispatch）：只产出 artifacts、不发 Release，
# 用来在打 tag 之前把整条流水线跑通一遍。
#
# 详细说明（版本号真源、本地复现命令、失败排查表）见 docs/发布流程.md。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布 vX.Y.Z（留空 = 只构建当前提交并产出 artifacts，不发 Release）"
        required: false
        type: string
      publish:
        description: "创建 GitHub Release（需要 tag 非空）"
        required: false
        type: boolean
        default: false

# 同一 tag 的发布不允许并发：两个 job 同时上传到同一条 Release 会互相覆盖。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 版本号只有一个真源：仓库根 VERSION。tag 必须与它逐字符一致，
  # 否则"tag 与包内版本对不上"这种事故没人会注意到。
  prep:
    name: 版本与 tag 校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      arch: ${{ steps.resolve.outputs.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析版本
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            publish=true
          else
            tag="${DISPATCH_TAG:-}"
            publish="${DISPATCH_PUBLISH:-false}"
          fi

          if [ -n "$tag" ]; then
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag '$tag' 必须形如 v0.0.1（VERSION 文件格式 MAJOR.MINOR.PATCH）"
              exit 1
            fi
            version="${tag#v}"
            if [ "$version" != "$file_version" ]; then
              echo "::error::VERSION 文件是 $file_version，tag 是 $tag —— 先把 VERSION 改成 $version 并提交"
              exit 1
            fi
          else
            version="$file_version"
          fi

          if [ "$publish" = "true" ] && [ -z "$tag" ]; then
            echo "::error::publish=true 但没给 tag：手工触发想发 Release 必须填 tag"
            exit 1
          fi

          # 发布物文件名里的架构，与 dpkg 的包文件名口径一致（linux-deb job 固定在
          # ubuntu-22.04 上构建，所以这里就是 amd64；改成矩阵构建时这里要跟着改）。
          arch="$(dpkg --print-architecture)"

          echo "版本：$version   tag：${tag:-<none>}   发布：$publish   架构：$arch"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "arch=$arch"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Linux deb
  linux-deb:
    name: Ubuntu deb（服务端）
    needs: prep
    # 22.04 而不是 latest：deb 的 glibc/libstdc++ 下限由构建机决定，
    # 在 22.04 上构建可以在 22.04/24.04 上装（在 24.04 上构建就只能 24.04+）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # vcpkg manifest 模式：按 vcpkg.json 的 builtin-baseline 取同一份 ports
      # 树并导出 VCPKG_ROOT，release_build_linux.sh 把它传给 CMake。
      - uses: ./.github/actions/setup-vcpkg

      - name: 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev file openssl

      # 构建 / ctest / 打 deb 三步都在 scripts/release_build_linux.sh 里：
      # 本地复现同一条命令，CI 与手工构建不会漂（docs/发布流程.md §2）。
      - name: 构建 + ctest + 打 deb（发布门禁）
        run: bash scripts/release_build_linux.sh build "${{ needs.prep.outputs.version }}"

      - name: 安装冒烟（dpkg -i → 自检 → 服务起停 → 卸载）
        run: |
          set -euo pipefail
          deb="$(ls build/packages/*.deb)"
          version="${{ needs.prep.outputs.version }}"

          # 带一行回显的断言（第四/五次跑挂过：set -e 静默退出时日志里只看到
          # 段落标题，不知道是哪一条）。定义放在所有使用之前。
          check() {
            echo "  - $1"; shift
            if ! "$@"; then echo "::error::检查失败：$*"; return 1; fi
          }

          sudo dpkg -i "$deb"

          echo "== 版本自检"
          fcp-server --version | tee /tmp/ver.txt
          grep -qF "fcp-server ${version}" /tmp/ver.txt
          fcp-client --version | grep -qF "fcp-client ${version}"

          echo "== dpkg 记录的文件清单"
          # 先打清单再逐条检查：落点类失败（第五次跑挂在文档路径上）只有
          # 清单在手才能判断是"没装"还是"装到别的路径/别的文件名"。
          dpkg -L fcp-server
          echo "== /usr/share/doc/fcp-server 实际内容"
          ls -la /usr/share/doc/fcp-server || true

          echo "== /etc/fcp 目录与 conffile 状态"
          # /etc/fcp 是 0750 root:root（env 里有 PSK，不能放宽），所以下面凡是
          # 碰 /etc 的检查都得 sudo：非 root 的 test -f 因父目录不可搜索而 EACCES，
          # 返回假——第六次跑就挂在这条上，日志里 dpkg -L 明明列着该文件。
          sudo ls -ld /etc/fcp
          sudo stat -c '%n  mode=%a  owner=%U:%G  size=%s' /etc/fcp/fcp.env

          echo "== 首次安装自动生成的 FCP_PSK"
          # postinst 在未配置 PSK 的新装上生成并写入一行 FCP_PSK；冒烟后面
          # 还能用自选密钥，是因为它显式覆盖 fcp.env，两不相扰。
          check "/etc/fcp/fcp.env 里已自动生成 FCP_PSK" \
            sudo sh -c "grep -qE '^FCP_PSK=[0-9a-fA-F]{32}' /etc/fcp/fcp.env"

          echo "== 包内文件落点"
          # 每一步都带一行回显：第四次跑时这里直接 exit 1，日志里只看到
          # "== 包内文件落点" 三个字，不知道是哪一条挂的（set -e 静默退出）。
          check "/usr/bin/fcp-server 可执行" test -x /usr/bin/fcp-server
          check "/usr/bin/fcp-client 可执行" test -x /usr/bin/fcp-client
          check "/etc/fcp/fcp.env 存在" sudo test -f /etc/fcp/fcp.env
          check "文档已装" test -f "/usr/share/doc/fcp-server/部署运维指南.md"
          echo "  - systemd unit 已注册"
          systemctl cat fcp >/dev/null || {
            echo "::error::systemctl cat fcp 失败；包内 unit 落点："
            dpkg -L fcp-server | grep -i systemd || echo "(包里没有 systemd 目录)"
            exit 1
          }
          echo "== conffile 登记（升级不覆盖运维配置的前提）"
          dpkg-query -W -f='${Conffiles}\n' fcp-server | tee /tmp/conf.txt
          grep -q '/etc/fcp/fcp.env' /tmp/conf.txt

          echo "== 服务起停（systemd 可用时）"
          if [ "$(systemctl is-system-running 2>/dev/null || true)" = "running" ] ||
             [ "$(systemctl is-system-running 2>/dev/null || true)" = "degraded" ]; then
            key="$(openssl rand -hex 16)"
            # Exercise the operator story exactly as documented: the conffile
            # lists FCP_PSK and nothing else (the unit is DynamicUser=yes,
            # which cannot read a root-owned 0600 key file, and the CLI picks
            # the FCP_PSK variable up implicitly when no --key* argument is
            # given). A --key-only smoke test would not catch that.
            printf 'FCP_PSK=%s\nFCP_ARGS=--bind=127.0.0.1 --port=45000 --log=debug --stats=5000 --speedtest\n' \
              "$key" | sudo tee /etc/fcp/fcp.env >/dev/null
            sudo systemctl start fcp
            sleep 2
            if ! systemctl is-active --quiet fcp; then
              sudo journalctl -u fcp --no-pager | tail -40
              exit 1
            fi
            sudo ss -uln | grep -q ':45000'
            sudo systemctl stop fcp
          else
            echo "::notice::本 runner 没有可用的 systemd，跳过服务起停检查"
          fi

          echo "== 卸载"
          sudo dpkg -r fcp-server
          test ! -e /usr/bin/fcp-server

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/packages/*.deb
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- Linux client AppImage
  linux-appimage:
    name: Linux 客户端 AppImage
    needs: prep
    # 与 deb 同一个构建机下限：AppImage 里打包 Qt 运行库，但 glibc/libstdc++
    # 仍来自构建机；22.04 构建可在 22.04/24.04 上运行。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg

      - name: 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev file curl \
            libgl1-mesa-dev patchelf xvfb xauth binutils \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0
          # 24.04 的 Qt xcb 插件需要它；22.04 不一定有这个包。
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 || true

      # AppImage 体积的大头是发行版 Qt 依赖的 ICU（解包后 ~35 MiB）。
      # 自编 qtbase 时关掉 ICU/OpenSSL/DBus，包体预计减半；Qt 编译约
      # 10 分钟，按版本+选项缓存，命中时直接复用前缀。
      - name: 恢复 Qt 无 ICU（缓存）
        id: qt-noicu
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qt-noicu-6.8.3
          key: qt-noicu-6.8.3-linux-${{ hashFiles('scripts/desktop/build_qt_noicu.sh') }}

      - name: 构建 Qt（缓存未命中时）
        if: steps.qt-noicu.outputs.cache-hit != 'true'
        run: bash scripts/desktop/build_qt_noicu.sh "${{ runner.temp }}/qt-noicu-6.8.3"

      # actions/cache 的保存挂在 job 收尾，job 一失败就跳过；显式 save 让
      # 后面 AppImage 步骤再挂也不用重编 16 分钟 Qt。
      - name: 保存 Qt 构建（缓存未命中时）
        if: steps.qt-noicu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qt-noicu-6.8.3
          key: qt-noicu-6.8.3-linux-${{ hashFiles('scripts/desktop/build_qt_noicu.sh') }}

      # CLI 构建 + Qt GUI + linuxdeploy 都在脚本里；本地同一命令可复现。
      - name: 构建 + AppImage（发布门禁）
        env:
          FCP_QT_PREFIX: ${{ runner.temp }}/qt-noicu-6.8.3
        run: bash scripts/desktop/build_linux.sh

      # Qt 在无显示环境下用 xvfb 起；6 秒后被 timeout 杀掉（rc=124）
      # 说明它没有启动即崩。GUI 无法做更强的无头断言。
      - name: 启动冒烟（离屏存活 6 秒）
        run: |
          set +e
          appimage="$(ls dist/*.AppImage | head -1)"
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 6 xvfb-run -a "$appimage"
          rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "::error::AppImage 启动后提前退出（rc=$rc）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------ Windows client
  windows-client:
    name: Windows 客户端（单文件便携 exe）
    needs: prep
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 单文件载荷用 Python 标准库做 LZMA（scripts/desktop/lzma_pack.py）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Qt 6 Widgets。install-qt-action 比在 CI 里用 vcpkg 现编 Qt 快得多；
      # QT_ROOT_DIR 指到 kit 目录，脚本从这里找 Qt6Config.cmake 与 windeployqt。
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - uses: ./.github/actions/setup-vcpkg

      # sidecar：GUI 壳不链接引擎，隧道跑在这两个 CLI 可执行文件里的 client。
      # 用默认的 Visual Studio 生成器（multi-config），runner 里不需要 vcvars。
      - name: 构建 CLI（sidecar）
        shell: pwsh
        run: |
          cmake -S . -B build/release-win `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DFCP_BUILD_PROXY=ON -DFCP_BUILD_TESTS=OFF -DFCP_BUILD_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/release-win --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Qt GUI + sidecar 收集 + windeployqt + 引导器单文件都在脚本里。
      - name: 构建 + 单文件便携 exe
        shell: pwsh
        run: |
          pwsh -File scripts/desktop/build_windows.ps1 `
            -ProxyBin build\release-win\apps\cli\Release\fcp-client.exe `
            -QtPrefix $env:QT_ROOT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 无头环境无法做更强的 GUI 断言；这里验证引导器能把载荷解到缓存、
      # Qt 运行库齐全、sidecar 可执行、产物已生成。
      - name: 冒烟（引导器自检 + sidecar --version）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\fcp-client-gui-*-windows-amd64.exe | Select-Object -First 1
          if (!$exe) { throw "没找到单文件便携 exe" }
          Write-Host "产物：$($exe.FullName) ($([math]::Round($exe.Length / 1MB, 1)) MiB)"
          $proc = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--fcp-launcher-selftest" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "引导器自检退出码 $($proc.ExitCode)" }
          $report = Join-Path $env:LOCALAPPDATA "FCP\selftest.txt"
          if (!(Test-Path $report)) { throw "自检没有写 $report" }
          Get-Content $report
          $cached = Get-ChildItem (Join-Path $env:LOCALAPPDATA "FCP\bin") -Directory |
                    Where-Object { Test-Path (Join-Path $_.FullName "FCP.exe") }
          if (!$cached) { throw "缓存里没有 FCP.exe" }
          foreach ($rel in @("Qt6Core.dll", "platforms\qwindows.dll", "fcp-client.exe")) {
            if (!(Test-Path (Join-Path $cached[0].FullName $rel))) {
              throw "缓存里缺少 $rel"
            }
          }
          & build\release-win\apps\cli\Release\fcp-client.exe --version
          if ($LASTEXITCODE -ne 0) { throw "sidecar --version 退出码 $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/fcp-client-gui-*-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Release
  publish:
    name: 发布 GitHub Release
    needs: [prep, linux-deb, linux-appimage, windows-client]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 汇总与校验和
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          ls -l release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # 说明文本放在 .github/release-notes-template.md（YAML 里塞 heredoc 太难读），
      # 这里只做占位替换。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prep.outputs.version }}
          TAG: ${{ needs.prep.outputs.tag }}
          ARCH: ${{ needs.prep.outputs.arch }}
        run: |
          set -euo pipefail
          sed -e "s|VERSION|${VERSION}|g" \
              -e "s|ARCH|${ARCH}|g" \
              -e "s|OWNER_REPO|${GH_REPO}|g" \
              -e "s|TAG|${TAG}|g" \
              .github/release-notes-template.md > /tmp/fcp-release-notes.md
          cat /tmp/fcp-release-notes.md
          # 不传 --generate-notes：它会把 PR 列表追加在 --notes 之后，
          # 而 tag 按约定打在 main 上，那串 PR 在这里没有信息量。
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "FCP $TAG" \
            --notes-file /tmp/fcp-release-notes.md \
            release/*
