<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCP · 方案 3 玻璃渐变</title>
<style>
  :root{
    --ink:#0d1017; --fg:#f1f5fb; --fg-2:#c3cede; --muted:#8493a8;
    --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.085);
    --stroke:rgba(255,255,255,.12); --stroke-hi:rgba(255,255,255,.22);
    --accent:#4f9cff; --accent-2:#8b5cf6; --teal:#2dd4bf; --ok:#34d399; --warn:#fcd34d; --err:#fb7185;
    --r:20px;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);color:var(--fg);overflow:hidden;
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei UI",sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
  }
  /* 背景：三个色斑 + 细网格 */
  .bg{position:fixed;inset:-20%;z-index:-2;filter:blur(70px);opacity:.8}
  .blob{position:absolute;border-radius:50%}
  .b1{width:52vw;height:52vw;left:-8vw;top:-14vw;background:radial-gradient(circle,#2563ebcc,transparent 62%)}
  .b2{width:46vw;height:46vw;right:-6vw;top:6vh;background:radial-gradient(circle,#7c3aedbb,transparent 62%)}
  .b3{width:40vw;height:40vw;left:28vw;bottom:-20vh;background:radial-gradient(circle,#0ea5e9aa,transparent 62%)}
  .bg-grid{
    position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
    background-size:32px 32px;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%);
  }

  .shell{height:100%;display:flex;flex-direction:column;padding:18px 20px 20px;gap:14px}

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:22px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:11px}
  [data-mark]{width:32px;height:32px;display:block;flex:0 0 auto;filter:drop-shadow(0 6px 14px #2563eb66)}
  .mark-bg{fill:#ffffff12;stroke:#ffffff22}
  .mark-f{fill:#fff}
  .mark-dot{fill:var(--teal)}
  .brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.12em}
  .brand p{margin:0;font-size:11px;color:var(--muted);letter-spacing:.08em}

  .hero{
    margin-left:auto;display:flex;align-items:center;gap:18px;
    padding:9px 18px;border-radius:999px;
    background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:inset 0 1px 0 #ffffff1a,0 10px 30px -18px #000;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#64748b;transition:.3s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px #34d39922,0 0 16px #34d399aa}
  .dot.bad{background:var(--err);box-shadow:0 0 0 4px #fb718522}
  .hero .label{font-size:11.5px;color:var(--muted);letter-spacing:.08em}
  .hero time{font:15px var(--mono);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

  /* ---------- 主网格：左表单 / 右侧 ---------- */
  main{
    flex:1;min-height:0;display:grid;gap:14px;
    grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
    grid-template-rows:auto minmax(150px,1fr);
    grid-template-areas:"conn log" "conn log";
  }
  .card{
    border-radius:var(--r);background:var(--glass);border:1px solid var(--stroke);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:inset 0 1px 0 #ffffff1f,0 24px 60px -30px #000000cc;
    padding:20px 22px;min-height:0;display:flex;flex-direction:column;
  }
  .card.conn{grid-area:conn}
  .right{display:flex;flex-direction:column;gap:14px;min-height:0;grid-area:log}
  .right .card{flex:0 0 auto}
  .right .card.log{flex:1 1 auto;min-height:150px}

  h2{
    margin:0 0 16px;font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--fg-2);
    text-transform:uppercase;display:flex;align-items:center;gap:10px;
  }
  h2 .badge{
    font:10px var(--mono);letter-spacing:.04em;text-transform:none;color:var(--teal);
    background:#2dd4bf1a;border:1px solid #2dd4bf3d;border-radius:999px;padding:1px 8px;
  }

  /* ---------- 表单 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 14px}
  label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--fg-2);letter-spacing:.03em}
  label.full{grid-column:1/-1}
  input{
    background:#ffffff0a;color:var(--fg);border:1px solid var(--stroke);border-radius:12px;
    padding:10px 12px;font:inherit;font-size:13px;outline:none;transition:.18s;
    user-select:text;-webkit-user-select:text;
  }
  input:hover:not(:disabled){background:#ffffff10}
  input:focus{background:#ffffff12;border-color:#ffffff45;box-shadow:0 0 0 4px #4f9cff2e}
  input:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}

  .check{flex-direction:row;align-items:center;gap:9px;margin-top:16px;font-size:12px;color:var(--muted)}
  .check input{width:16px;height:16px;padding:0;accent-color:var(--teal)}

  .actions{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:18px}
  button{
    border-radius:12px;padding:10px 20px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--glass-2);color:var(--fg);border:1px solid var(--stroke-hi);transition:.18s;
  }
  button:hover:not(:disabled){background:#ffffff1a}
  button:disabled{opacity:.4;cursor:default}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:#ffffff33;color:#fff;
    box-shadow:0 10px 30px -12px #4f9cffcc,inset 0 1px 0 #ffffff47;
  }
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button.ghost{background:transparent;padding:9px 13px;font-size:12px;color:var(--fg-2);border-color:var(--stroke)}
  button.right{margin-left:auto}
  #hint{font-size:12px;color:var(--muted);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 指标：大数字 + 胶囊 ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{
    border-radius:14px;background:#ffffff07;border:1px solid var(--stroke);
    padding:11px 13px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;
  }
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.6}
  .stat:nth-child(2)::before{background:var(--teal)}
  .stat:nth-child(3)::before{background:var(--accent-2)}
  .stat .cap{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
  .stat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .metrics.diag{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .metrics.diag .metric{
    display:flex;gap:7px;align-items:baseline;padding:3px 10px;border-radius:999px;
    background:#fcd34d1a;border:1px solid #fcd34d40;font-size:11.5px;color:var(--warn);
  }
  .metrics.diag .metric .cap{color:#fcd34dc0}
  .metrics.diag .metric b{font-weight:600}

  /* ---------- 日志 ---------- */
  .log h2{margin-bottom:12px}
  .log pre{
    flex:1;min-height:80px;margin:0;overflow:auto;border-radius:14px;
    background:#05070b99;border:1px solid var(--stroke);padding:11px 13px;
    font:12px/1.62 var(--mono);white-space:pre-wrap;word-break:break-all;color:#c2cee0;
    user-select:text;-webkit-user-select:text;
  }
  .log pre::-webkit-scrollbar{width:8px}
  .log pre::-webkit-scrollbar-thumb{background:#ffffff26;border-radius:8px}
  .log .err{color:var(--warn)}
  .log .out{color:#93a1b6}

  @media (max-width:880px){
    main{grid-template-columns:1fr;grid-template-rows:auto auto minmax(140px,1fr);grid-template-areas:"conn" "log" "log"}
    .right{grid-area:auto}
  }
</style>
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<div class="bg-grid"></div>

<div class="shell">
  <header class="bar">
    <div class="brand">
      <span data-mark></span>
      <div><h1>FCP</h1><p>可靠传输客户端</p></div>
    </div>
    <div class="hero">
      <span class="dot" id="dot"></span>
      <span class="label">运行</span>
      <time id="uptime">--</time>
    </div>
  </header>

  <main>
    <section class="card conn">
      <h2>连接参数 <span class="badge">UDP / FEC</span></h2>
      <div class="grid">
        <label class="full">服务器地址<input id="host" placeholder="1.2.3.4 或 vpn.example.com" /></label>
        <label>UDP 端口<input id="port" type="number" min="1" max="65535" value="4460" /></label>
        <label>预共享密钥
          <span class="row">
            <input id="key" type="password" maxlength="32" spellcheck="false" placeholder="32 位十六进制" autocomplete="off" />
            <button class="ghost" id="keyToggle" type="button">显示</button>
          </span>
        </label>
        <label>本地监听地址<input id="listen" value="127.0.0.1" /></label>
        <label>本地代理端口<input id="listenPort" type="number" min="1" max="65535" value="1080" /></label>
        <label>MTU<input id="mtu" type="number" min="576" max="9000" value="1400" /></label>
        <label>FEC 冗余上限<input id="budget" type="number" step="0.05" min="0" max="1" value="0.5" /></label>
        <label class="full">固定 k（-1 = 自适应）<input id="k" type="number" min="-1" max="7" value="-1" /></label>
      </div>
      <label class="check"><input id="remember" type="checkbox" checked /> 记住设置（密钥以明文保存在本机，按需勾选）</label>
      <div class="actions">
        <button id="start" class="primary" type="button">启动代理</button>
        <button id="stop" type="button" disabled>停止</button>
        <span id="hint"></span>
      </div>
    </section>

    <div class="right">
      <section class="card">
        <h2>运行状态</h2>
        <div class="stats">
          <div class="stat"><span class="cap">活动会话</span><b id="m-live">0</b></div>
          <div class="stat"><span class="cap">已建立</span><b id="m-est">0</b></div>
          <div class="stat"><span class="cap">隧道</span><b id="m-tun">0</b></div>
          <div class="stat"><span class="cap">上行</span><b id="m-tx">0 B</b></div>
          <div class="stat"><span class="cap">下行</span><b id="m-rx">0 B</b></div>
          <div class="stat"><span class="cap">采样时长</span><b id="m-t">--</b></div>
        </div>
        <div class="metrics diag" id="diag"></div>
      </section>

      <section class="card log">
        <h2>日志 <button class="ghost right" id="clear" type="button">清空</button></h2>
        <pre id="log"></pre>
      </section>
    </div>
  </main>
</div>

<script src="tokens.js"></script>
<script src="app.js"></script>
</body>
</html>
