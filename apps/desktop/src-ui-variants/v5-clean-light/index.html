<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCP · 方案 5 清爽浅色</title>
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafc; --line:#e6eaf0; --line-2:#eef1f5;
    --fg:#111827; --fg-2:#374151; --muted:#6b7280; --muted-2:#9aa3af;
    --accent:#4f46e5; --accent-soft:#eef0ff; --ok:#10b981; --ok-soft:#e8f8f1; --warn:#b45309; --warn-soft:#fff7e6; --err:#dc2626;
    --r:16px; --shadow:0 1px 2px #0f172a08,0 8px 24px -12px #0f172a1a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei UI",sans-serif;
    display:flex;flex-direction:column;padding:0 24px 24px;user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:12px;height:68px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:11px}
  [data-mark]{width:32px;height:32px;display:block;flex:0 0 auto;border-radius:9px;box-shadow:var(--shadow)}
  .mark-bg{fill:#111827}
  .mark-f{fill:#ffffff}
  .mark-dot{fill:#60a5fa}
  .brand b{font-size:16px;letter-spacing:.06em}
  .brand small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .bar .spacer{flex:1}
  .badge{
    display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
    font-size:12.5px;color:var(--fg-2);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#c3c9d2;transition:.25s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px #10b9811f}
  .dot.bad{background:var(--err);box-shadow:0 0 0 4px #dc26261f}
  .badge time{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}

  /* ---------- 布局 ---------- */
  main{
    flex:1;min-height:0;display:grid;gap:16px;
    grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);
    grid-template-rows:auto minmax(170px,1fr);
    grid-template-areas:"conn status" "log log";
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:18px 24px;min-height:0;display:flex;flex-direction:column;
  }
  .card.conn{grid-area:conn;overflow:auto}
  .card.status{grid-area:status} .card.log{grid-area:log}
  .card.conn::-webkit-scrollbar{width:8px}
  .card.conn::-webkit-scrollbar-thumb{background:#e2e6ec;border-radius:8px}
  h2{margin:0 0 12px;font-size:14px;font-weight:650;color:var(--fg);display:flex;align-items:center;gap:8px}
  h2 small{font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}

  /* 连接表单：底部下划线输入，标签在输入之上 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--fg-2)}
  label.full{grid-column:1/-1}
  input{
    width:100%;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:400;outline:none;transition:.15s;
    user-select:text;-webkit-user-select:text;
  }
  input:hover:not(:disabled){border-color:#d6dce5}
  input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px #4f46e51f}
  input:disabled{opacity:.55;background:#f3f4f6}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}

  .check{flex-direction:row;align-items:center;gap:9px;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:400}
  .check input{width:16px;height:16px;padding:0;accent-color:var(--accent)}

  .actions{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line-2)}
  button{
    background:var(--surface);color:var(--fg-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 18px;font:inherit;font-size:13px;font-weight:550;cursor:pointer;transition:.15s;
    box-shadow:0 1px 2px #0f172a0a;
  }
  button:hover:not(:disabled){border-color:#d0d6df;color:var(--fg)}
  button:disabled{opacity:.45;cursor:default;box-shadow:none}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px #4f46e5cc}
  button.primary:hover:not(:disabled){background:#4338ca;border-color:#4338ca;color:#fff}
  button.ghost{background:var(--surface-2);padding:8px 11px;font-size:12px;border-color:var(--line);box-shadow:none}
  button.right{margin-left:auto;font-weight:450}
  #hint{font-size:12.5px;color:var(--muted);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 状态：小卡片网格 ---------- */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .metric{
    background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;
    padding:9px 14px;display:flex;flex-direction:column;gap:1px;
  }
  .metric .cap{font-size:11.5px;color:var(--muted)}
  .metric b{font-size:18px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
  .metric.hero{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;
    background:linear-gradient(120deg,#eef0ff,#f5f3ff);border-color:#e0e2ff}
  .metric.hero .cap{color:var(--accent);font-weight:600}
  .metric.hero b{font-size:26px;color:var(--accent)}

  #diag{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  #diag .metric{
    flex-direction:row;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:var(--warn-soft);border-color:#fde7c2;
  }
  #diag .metric .cap{color:var(--warn);font-size:12px}
  #diag .metric b{font-size:13px;color:var(--warn)}

  /* ---------- 日志 ---------- */
  .log pre{
    flex:1;min-height:90px;margin:0;overflow:auto;background:var(--surface-2);
    border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;
    font:12px/1.6 ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    white-space:pre-wrap;word-break:break-all;color:#475569;
    user-select:text;-webkit-user-select:text;
  }
  .log pre::-webkit-scrollbar{width:10px}
  .log pre::-webkit-scrollbar-thumb{background:#d6dce5;border-radius:10px;border:2px solid var(--surface-2)}
  .log .err{color:var(--warn);font-weight:500}
  .log .out{color:#64748b}

  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-areas:"conn" "status" "log"}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span data-mark></span>
    <div><b>FCP</b><small>可靠传输客户端</small></div>
  </div>
  <div class="spacer"></div>
  <div class="badge">
    <span class="dot" id="dot"></span>
    <span>运行时长</span>
    <time id="uptime">--</time>
  </div>
</header>

<main>
  <section class="card conn">
    <h2>连接设置 <small>修改后需重新启动才生效</small></h2>
    <div class="grid">
      <label class="full">服务器地址<input id="host" placeholder="1.2.3.4 或 vpn.example.com" /></label>
      <label>UDP 端口<input id="port" type="number" min="1" max="65535" value="4460" /></label>
      <label>预共享密钥
        <span class="row">
          <input id="key" type="password" maxlength="32" spellcheck="false" placeholder="32 位十六进制" autocomplete="off" />
          <button class="ghost" id="keyToggle" type="button">显示</button>
        </span>
      </label>
      <label>本地监听地址<input id="listen" value="127.0.0.1" /></label>
      <label>本地代理端口<input id="listenPort" type="number" min="1" max="65535" value="1080" /></label>
      <label>MTU<input id="mtu" type="number" min="576" max="9000" value="1400" /></label>
      <label>FEC 冗余上限<input id="budget" type="number" step="0.05" min="0" max="1" value="0.5" /></label>
      <label class="full">固定 k（-1 = 自适应）<input id="k" type="number" min="-1" max="7" value="-1" /></label>
    </div>
    <label class="check"><input id="remember" type="checkbox" checked /> 记住设置（密钥以明文保存在本机，按需勾选）</label>
    <div class="actions">
      <button id="start" class="primary" type="button">启动代理</button>
      <button id="stop" type="button" disabled>停止</button>
      <span id="hint"></span>
    </div>
  </section>

  <section class="card status">
    <h2>运行状态</h2>
    <div class="metrics">
      <div class="metric hero"><span class="cap">活动会话</span><b id="m-live">0</b></div>
      <div class="metric"><span class="cap">已建立</span><b id="m-est">0</b></div>
      <div class="metric"><span class="cap">隧道</span><b id="m-tun">0</b></div>
      <div class="metric"><span class="cap">上行</span><b id="m-tx">0 B</b></div>
      <div class="metric"><span class="cap">下行</span><b id="m-rx">0 B</b></div>
      <div class="metric"><span class="cap">采样时长</span><b id="m-t">--</b></div>
    </div>
    <div class="metrics" id="diag"></div>
  </section>

  <section class="card log">
    <h2>日志 <small>stdout / stderr</small> <button class="ghost right" id="clear" type="button">清空</button></h2>
    <pre id="log"></pre>
  </section>
</main>

<script src="tokens.js"></script>
<script src="app.js"></script>
</body>
</html>
