<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCP · 浅色 3 薄荷暖白</title>
<style>
  :root{
    --bg:#f4f7f5;
    --surface:#ffffff;
    --surface-2:#f7faf8;
    --line:#e6ede9;
    --line-2:#eef4f0;
    --fg:#17251f;
    --fg-2:#3b4a43;
    --muted:#5b6b63;
    --muted-2:#8a9a91;
    --accent:#0f9d76;
    --accent-2:#0b8563;
    --mint:#e8f6f0;
    --mint-2:#d5eee4;
    --sand:#f0b46a;
    --sand-soft:#fdf3e5;
    --err:#c2410c;
    --r:20px;
    --shadow:0 1px 2px rgba(20,60,45,.04), 0 18px 40px -22px rgba(20,80,60,.22);
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(900px 420px at 50% -10%, #eefaf4 0%, transparent 70%), var(--bg);
    color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei UI",sans-serif;
    display:flex;flex-direction:column;padding:0 26px 24px;
    user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;align-items:center;gap:12px;height:72px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px}
  [data-mark]{width:36px;height:36px;display:block;flex:0 0 auto;border-radius:12px;box-shadow:0 8px 18px -10px rgba(15,157,118,.7)}
  .mark-bg{fill:#0f9d76}
  .mark-f{fill:#fff}
  .mark-dot{fill:#bff0dc}
  .brand b{font-size:16px;letter-spacing:.02em}
  .brand small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .bar .spacer{flex:1}
  .pill{
    display:flex;align-items:center;gap:9px;height:38px;padding:0 16px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:12.5px;color:var(--muted);
  }
  .pill time{font:13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;min-width:44px;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;background:#c6d3cc;transition:.25s}
  .dot.on{background:var(--accent);box-shadow:0 0 0 4px rgba(15,157,118,.16)}
  .dot.bad{background:var(--err);box-shadow:0 0 0 4px rgba(194,65,12,.14)}

  /* ---------- 布局 ---------- */
  main{
    flex:1;min-height:0;display:grid;gap:18px;
    grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"conn status" "log status";
    max-width:1320px;width:100%;margin:0 auto;
  }
  .conn{grid-area:conn} .side{grid-area:status} .card.log{grid-area:log}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:24px 28px;min-height:0;display:flex;flex-direction:column;
  }
  h2{
    margin:0 0 16px;font-size:15px;font-weight:650;color:var(--fg);
    display:flex;align-items:center;gap:10px;
  }
  h2 small{font-size:12.5px;font-weight:400;color:var(--muted)}
  .card.log h2{margin-bottom:10px}

  /* 表单正文竖向均分：卡片再高也不会在底部留一块死白 */
  .conn .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .conn .body .actions{margin-top:auto}

  /* ---------- 表单 ---------- */
  .field-list{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field > .lbl{font-size:12.5px;font-weight:550;color:var(--fg-2);display:flex;align-items:center;gap:8px}
  .field > .lbl em{font-style:normal;font-weight:400;color:var(--muted);font-size:11.5px}
  .field.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field.dual > div{display:flex;flex-direction:column;gap:7px}

  .input-wrap{position:relative;display:flex;align-items:center}
  input{
    width:100%;height:46px;background:var(--surface-2);color:var(--fg);
    border:1px solid var(--line);border-radius:13px;padding:0 14px;
    font:inherit;font-size:14px;font-weight:450;outline:none;transition:.16s;
    user-select:text;-webkit-user-select:text;
  }
  input:hover:not(:disabled){border-color:#cfe0d8;background:#fbfdfc}
  input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,157,118,.12)}
  input:disabled{opacity:1;background:#f3f8f5;color:var(--fg-2);cursor:default}
  input::placeholder{color:var(--muted-2);font-weight:400}
  .input-wrap input.has-trail{padding-right:96px}
  .trail{position:absolute;right:6px;display:flex;align-items:center;gap:4px}
  .key-state{font-size:11.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;padding:0 4px}
  .key-state.ok{color:var(--accent)}
  .key-state.bad{color:var(--err)}

  button{
    font:inherit;cursor:pointer;border-radius:12px;transition:.16s;border:1px solid var(--line);
    background:var(--surface);color:var(--fg-2);padding:0 16px;height:42px;font-size:13.5px;font-weight:550;
  }
  button:hover:not(:disabled){border-color:#cfe0d8;color:var(--fg);background:#fafdfb}
  button:disabled{opacity:.5;cursor:default}
  button.primary{
    height:48px;padding:0 28px;font-size:14.5px;font-weight:600;color:#fff;border-color:transparent;
    background:linear-gradient(180deg,#12ad82,var(--accent));
    box-shadow:0 12px 24px -12px rgba(15,157,118,.75), inset 0 1px 0 rgba(255,255,255,.25);
  }
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#14b98b,#0d8f6c);color:#fff}
  button.ghost{height:32px;padding:0 11px;font-size:12px;color:var(--fg-2);background:var(--surface)}
  button.icon{padding:0;width:34px;height:34px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
  button.right{margin-left:auto;height:32px;padding:0 12px;font-size:12px}

  .actions{display:flex;align-items:center;gap:12px;margin-top:20px}
  .actions .status-line{font-size:12.5px;color:var(--muted);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions .status-line.error{color:var(--err)}

  /* 「高级」折叠区 */
  .adv-toggle{
    display:flex;align-items:center;gap:8px;margin-top:16px;padding:12px 0 0;border-top:1px solid var(--line-2);
    color:var(--muted);font-size:12.5px;background:transparent;border-left:0;border-right:0;border-bottom:0;
    height:auto;border-radius:0;width:100%;justify-content:flex-start;font-weight:500;
  }
  .adv-toggle:hover:not(:disabled){color:var(--accent);background:transparent;border-color:var(--line-2)}
  .adv-toggle .chev{transition:transform .2s;font-size:10px;color:var(--muted-2)}
  .adv-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .adv-toggle .defaults{margin-left:auto;font-size:11.5px;color:var(--muted-2);font-weight:400}
  .adv-body{
    margin-top:14px;padding:16px 16px 4px;border-radius:15px;background:var(--mint);
    border:1px dashed var(--mint-2);display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;
  }
  .adv-body[hidden]{display:none}
  .adv-body .field > .lbl{font-size:12px}
  .adv-body input{height:38px;font-size:13px;background:#fff}
  .adv-body .full{grid-column:1/-1}
  .adv-note{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:0 0 4px}

  .check{display:flex;align-items:center;gap:9px;margin-top:0;font-size:12.5px;color:var(--muted);font-weight:400}
  .check input{width:16px;height:16px;padding:0;accent-color:var(--accent)}

  /* ---------- 状态 / 健康卡 ---------- */
  .status-card{padding:22px 24px}
  .status-card .panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .status-card .panel .spacer-block{flex:1 1 0;min-height:6px}
  .health{display:flex;align-items:center;gap:14px;margin:-2px 0 14px}
  .health .glyph{
    width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
    background:var(--mint);color:var(--accent);
  }
  .health .glyph svg{width:24px;height:24px}
  .health .meta{min-width:0}
  .health .meta .cap{font-size:12px;color:var(--muted)}
  .big{display:flex;align-items:baseline;gap:8px;margin:0}
  .big b{font-size:36px;line-height:1.05;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--fg)}
  .big span{font-size:12.5px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;
    background:var(--mint);color:#0b7a5c;font-size:11.5px;font-weight:550;border:1px solid var(--mint-2);
  }
  /* 中性 chip：描述性事实（k 自适应 等），不用暖色，避免读成告警 */
  .chip.neutral{background:#f3f7f5;color:#4f6358;border-color:#e3ece7}
  .chip.neutral .muted{color:#7d8d84}
  .chip.sand{background:var(--sand-soft);color:#a8621a;border-color:#f7e2c6}
  .chip .k{font-weight:600}
  .chip .muted{color:#4c7a6b;font-weight:400}

  .traffic{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .traffic .t{
    display:flex;flex-direction:column;gap:5px;padding:14px 14px;border-radius:16px;
    background:var(--surface-2);border:1px solid var(--line-2);
  }
  .traffic .t .cap{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .traffic .t .cap .arrow{font-size:11px;color:var(--accent)}
  .traffic .t .cap.down .arrow{color:#3b7fd4}
  .traffic .t b{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.01em}

  /* 两列「标签 …… 值」：每格自身是 1fr+auto 的小网格，标签不换行、值右对齐，
     列宽由 grid 保证对齐，不依赖 flex 的可用宽度。 */
  .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
  .mini{
    display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;
    padding:7px 0;border-bottom:1px dashed var(--line-2);min-width:0;
  }
  .mini:nth-last-child(-n+2){border-bottom:0}
  .mini .cap{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap;text-align:right}

  #diag{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  #diag[hidden]{display:none}
  #diag .metric{
    display:flex;gap:7px;align-items:baseline;padding:4px 10px;border-radius:8px;
    background:var(--sand-soft);color:#a8621a;font-size:11.5px;border:1px solid #f7e2c6;
  }
  #diag .metric .cap{color:#a8621a}
  #diag .metric b{font-weight:600}

  /* ---------- 日志 ---------- */
  .card.log{min-height:0}
  body.is-running #start{display:none}
  body.is-running #stop{
    height:48px;padding:0 28px;font-size:14.5px;font-weight:600;color:#fff;border-color:transparent;
    background:linear-gradient(180deg,#37473f,#25322c);
    box-shadow:0 12px 24px -14px rgba(23,37,31,.6);
  }
  body.is-running #stop:hover{background:linear-gradient(180deg,#40524a,#2b3932);color:#fff}
  .log pre{
    flex:1 1 auto;min-height:80px;margin:0;overflow:auto;background:var(--surface-2);
    border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;
    font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;color:#4f5f57;
    box-shadow:inset 0 2px 6px rgba(20,80,60,.05);
    user-select:text;-webkit-user-select:text;
  }
  .log pre::-webkit-scrollbar{width:10px}
  .log pre::-webkit-scrollbar-thumb{background:#d7e4dd;border-radius:10px;border:2px solid var(--surface-2)}
  .log .err{color:#b45309}
  .log .out{color:#6d7f76}

  /* 矮屏（Tauri 最小窗口）与窄屏都退回单列，整页滚动，不压叠、不裁切。
     断点按「最小窗口 980 宽」定，留出滚动条 15px 的余量。 */
  @media (max-width:1000px), (max-height:700px){
    main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"conn" "status" "log"}
    .card,.card.log{min-height:auto}
    .conn .body .actions{margin-top:16px}
    .status-card .panel .spacer-block{display:none}
    .card.log{height:min(260px,45vh)}
    .card.log{min-height:150px}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span data-mark></span>
    <div><b>FCP</b><small>可靠传输客户端</small></div>
  </div>
  <div class="spacer"></div>
  <div class="pill">
    <span class="dot" id="dot"></span>
    <span id="state-text">未连接</span>
    <time id="uptime">--</time>
  </div>
</header>

<main>
  <section class="card conn">
    <h2>连接</h2>

    <div class="body">
    <div class="field-list">
      <div class="field">
        <span class="lbl">服务器地址</span>
        <div class="input-wrap"><input id="host" placeholder="1.2.3.4 或 vpn.example.com" autocomplete="off" spellcheck="false" /></div>
      </div>

      <div class="field dual">
        <div>
          <span class="lbl">UDP 端口</span>
          <div class="input-wrap"><input id="port" type="number" min="1" max="65535" value="4460" /></div>
        </div>
        <div>
          <span class="lbl">本地代理端口 <em>SOCKS5 / HTTP</em></span>
          <div class="input-wrap"><input id="listenPort" type="number" min="1" max="65535" value="1080" /></div>
        </div>
      </div>

      <div class="field">
        <span class="lbl">预共享密钥 <em>32 位十六进制</em></span>
        <div class="input-wrap">
          <input id="key" class="has-trail" type="password" maxlength="32" spellcheck="false" placeholder="与服务端一致" autocomplete="off" />
          <span class="trail">
            <span class="key-state" id="keyState"></span>
            <button class="icon" id="keyToggle" type="button" title="显示 / 隐藏">👁</button>
          </span>
        </div>
      </div>
    </div>

    <label class="check"><input id="remember" type="checkbox" checked /> 记住设置</label>

    <button class="adv-toggle" id="advToggle" type="button" aria-expanded="false" aria-controls="advBody">
      <span class="chev">▶</span><span data-label>高级设置</span>
      <span class="defaults">MTU 1400 · FEC 0.5 · k 自适应 · 127.0.0.1</span>
    </button>
    <div class="adv-body" id="advBody" hidden>
      <div class="field"><span class="lbl">本地监听地址</span><input id="listen" value="127.0.0.1" /></div>
      <div class="field"><span class="lbl">MTU</span><input id="mtu" type="number" min="576" max="9000" value="1400" /></div>
      <div class="field"><span class="lbl">FEC 冗余上限 <em>0–1</em></span><input id="budget" type="number" step="0.05" min="0" max="1" value="0.5" /></div>
      <div class="field"><span class="lbl">固定 k <em>-1 = 自适应</em></span><input id="k" type="number" min="-1" max="7" value="-1" /></div>
      <p class="adv-note">不展开时使用上面的默认值，效果与显式填写相同。</p>
    </div>

    <div class="actions">
      <button id="start" class="primary" type="button">启动代理</button>
      <button id="stop" type="button" disabled>停止</button>
      <span id="hint" class="status-line"></span>
    </div>
    </div>
  </section>

  <section class="card status-card side">
    <h2>运行状态</h2>

    <div class="panel">
    <div class="health">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>
        </svg>
      </span>
      <div class="meta">
        <div class="cap">活动会话</div>
        <div class="big"><b id="m-live">0</b><span>个</span></div>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="k">UDP</span><span class="muted">/</span><span class="k">FEC</span></span>
      <span class="chip"><span class="muted">MTU</span><span class="k">1400</span></span>
      <span class="chip neutral"><span class="muted">k</span><span class="k">自适应</span></span>
    </div>

    <div class="traffic">
      <div class="t"><span class="cap"><span class="arrow">↑</span>上行 OUT</span><b id="m-tx">0 B</b></div>
      <div class="t"><span class="cap down"><span class="arrow">↓</span>下行 IN</span><b id="m-rx">0 B</b></div>
    </div>

    <!-- 竖向留白放在读数块下方：卡片再高，也不会把数字挤散或让底部空一块 -->
    <div class="spacer-block"></div>

    <div class="mini-grid">
      <div class="mini"><span class="cap">已建立</span><b id="m-est">0</b></div>
      <div class="mini"><span class="cap">隧道</span><b id="m-tun">0</b></div>
      <div class="mini"><span class="cap">采样</span><b id="m-t">--</b></div>
      <div class="mini"><span class="cap">传输</span><b>UDP / FEC</b></div>
    </div>

    <div id="diag" hidden></div>
    </div>
  </section>

  <section class="card log">
    <h2>日志 <button class="ghost right" id="clear" type="button">清空</button></h2>
    <pre id="log"></pre>
  </section>
</main>

<script src="tokens.js"></script>
<script src="app-light.js"></script>
<script>
  document.addEventListener("fcp:state", (e) => {
    const t = document.getElementById("state-text");
    if (t) t.textContent = e.detail.running ? "已连接" : "未连接";
  });
</script>
</body>
</html>
