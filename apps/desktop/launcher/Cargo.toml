[package]
name = "fcp-launcher"
version = "0.1.0"
edition = "2021"
description = "FCP 单文件引导器：首次运行解压载荷到本地缓存，之后直接启动"
license = "MIT"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-winres = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
